<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    /* shared:CaptureStyles */
  :root {
    --ink: #17212B;
    --muted: #4F5D6B;
    /* State of Minnesota brand: Minnesota Blue and Minnesota Green. */
    --navy: #003865;
    --navy-2: #0D4E80;
    --cyan: #78BE21;
    --ground: #F4F6F8;
    --surface: #FFFFFF;
    --line: #D5DCE3;
    --line-strong: #9AA7B4;
    --focus: #1565C0;
    --good: #1E6B3A;
    --good-bg: #E6F2EA;
    --warn: #8A4B00;
    --warn-bg: #FFF3E0;
    --bad: #A1261B;
    --bad-bg: #FCEBEA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(11, 43, 70, .08), 0 2px 8px rgba(11, 43, 70, .06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 17px/1.5 var(--font); color: var(--ink); background: var(--ground); }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.1rem; }
  p { margin: 0; }
  a { color: var(--focus); }
  ::selection { background: #CDE9F8; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }

  .bar { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .bar .tag { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: #CFE3F2; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font: 600 1rem/1.2 var(--font);
    cursor: pointer; text-decoration: none; background: var(--surface); color: var(--navy); border-color: var(--line-strong); }
  .btn:hover { border-color: var(--navy); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-quiet { background: transparent; border-color: transparent; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; padding-inline: 6px; }
  .btn-on-dark { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .btn-small { min-height: 36px; padding: 6px 10px; font-size: .875rem; }
  .btn-block { width: 100%; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  label, .label { display: block; font-weight: 650; margin-bottom: 4px; }
  .hint { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; font: 1rem/1.4 var(--font); color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 88px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--focus); }

  .alert { border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
  .alert-bad { background: var(--bad-bg); color: var(--bad); }
  .alert-good { background: var(--good-bg); color: var(--good); }
  .alert-warn { background: var(--warn-bg); color: var(--warn); }
  .alert:empty { display: none; }

  .level { display: inline-flex; align-items: center; justify-content: center; min-width: 2.4em; padding: 1px 7px;
    border-radius: 6px; font-weight: 700; font-size: .85rem; border: 1px solid var(--line-strong); background: #fff; color: var(--navy); }
  .level[data-route="parking"] { border-style: dashed; color: var(--warn); border-color: #C88A3A; }

  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .9s linear infinite; }
  .spinner.dark { border-color: rgba(0,56,101,.2); border-top-color: var(--navy); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow); z-index: 50; }
  .toast[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media print { .bar, .btn, .toast { display: none !important; } body { background: #fff; } }
  /* /shared:CaptureStyles */
  </style>
  <style>
    body { font-size: 16px; }
    main { padding: 16px; max-width: 1680px; margin: 0 auto; }
    .bar .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* On a phone the buttons wrap under the title instead of squeezing it to a letter per line. */
    .bar { flex-wrap: wrap; }
    .bar .back { color: #FFFFFF; text-decoration: underline; text-underline-offset: 2px; }
    .bar .back:focus-visible { outline: 3px solid #78BE21; outline-offset: 2px; }
    .stepper { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: #E8F1F8; border-bottom: 1px solid var(--line); }
    .step { display: grid; text-align: left; min-width: 104px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; font: inherit; color: var(--ink); }
    .step .l { font-weight: 700; font-size: .9rem; }
    .step[aria-current="step"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
    .tab { border: 0; background: none; padding: 10px 12px; font: 600 .95rem var(--font); color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
    .tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
    .summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 12px 16px; margin-bottom: 12px; }
    .summary .big { font-size: 1.5rem; font-weight: 750; color: var(--navy); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: .85rem; background: var(--ground); font-variant-numeric: tabular-nums; }
    .pill.zero { color: var(--bad); border-color: #E7B6B1; background: var(--bad-bg); }
    .section { padding: 12px 14px; }
    .section + .section { margin-top: 12px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .list li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; display: flex; gap: 8px; align-items: flex-start; }
    .list li.is-hidden { opacity: .5; }
    .list .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .two { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 12px; align-items: start; }
    @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
    .feed { max-height: calc(100vh - 300px); overflow: auto; }
    .cols { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 10px; align-items: start; }
    @media (max-width: 1200px) { .cols { grid-template-columns: 1fr; } }
    .col { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
    .col.drop, .group.drop, .tray.drop { box-shadow: 0 0 0 3px var(--cyan); }
    .col h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; margin: 4px 4px 8px; }
    .group { background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; margin-bottom: 8px; }
    .group-head { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); }
    .order { display: flex; flex-direction: column; gap: 2px; }
    .order .btn { min-height: 24px; padding: 0 7px; font-size: .75rem; }
    .topic { font-weight: 700; padding: 6px 8px; }
    .colsel { width: auto; padding: 4px 6px; font-size: .8rem; }
    .gstats { padding: 6px 8px 0; color: var(--muted); font-size: .8rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .contested { font-weight: 800; color: var(--warn); border: 1px dashed #C88A3A; border-radius: 6px; padding: 0 5px; }
    .gchips { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px; min-height: 40px; }
    .chip { display: inline-flex; gap: 5px; align-items: baseline; max-width: 100%; text-align: left; border: 1px solid var(--line); background: var(--ground);
      border-radius: 8px; padding: 4px 7px; font: .8rem/1.35 var(--font); color: var(--ink); cursor: grab; }
    .chip[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); background: #fff; }
    .chip .t { color: var(--muted); white-space: nowrap; }
    .chip .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 26ch; }
    .gfoot { display: flex; justify-content: space-between; gap: 6px; padding: 0 8px 8px; flex-wrap: wrap; }
    .tray { background: #FFF8EC; border: 1px dashed #C88A3A; border-radius: 10px; padding: 8px; margin-bottom: 10px; }
    .publish-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--ground); margin-bottom: 10px; }
    table.tally { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.tally th, table.tally td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
    table.tally th { font-size: .8rem; color: var(--muted); font-weight: 650; }
    table.tally td.num, table.tally th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.tally input { width: 4.2em; padding: 4px 6px; text-align: right; }
    .tdnote { display: grid; grid-template-columns: 9em 1fr; gap: 4px 10px; font-size: .9rem; margin-top: 6px; }
    .tdnote dt { color: var(--muted); font-weight: 650; }
    .tdnote dd { margin: 0; overflow-wrap: anywhere; }
    .setup { max-width: 520px; margin: 24px auto; padding: 20px; }
    .setup > * + * { margin-top: 14px; }
    .sessions { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
    .sessions a { display: block; padding: 12px 14px; text-decoration: none; color: var(--ink); }
    .empty { padding: 16px; text-align: center; color: var(--muted); }
    .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
    .sw-green { background: #2E8B57; } .sw-blue { background: #2F6FD0; } .sw-yellow { background: #E7B416; }
    .paper { border: 2px solid var(--navy); }
    .paper-controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .paper-controls > div { min-width: 150px; }
    .paper-controls select, .paper-controls input[type="text"] { width: auto; min-width: 140px; }
    table.review { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 10px; }
    table.review th, table.review td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
    table.review th { font-size: .8rem; color: var(--muted); font-weight: 650; }
    table.review textarea { min-height: 52px; font-size: .9rem; }
    table.review input[type="number"] { width: 4.2em; padding: 4px 6px; }
    table.review select { width: auto; max-width: 22em; }
    table.review tr.off td { opacity: .45; }
    .read-as { font-size: .8rem; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
    .dotgrid { display: grid; grid-template-columns: auto repeat(3, 4.6em); gap: 4px 6px; align-items: center; font-size: .8rem; }
    table.audit { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.audit th, table.audit td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
    table.audit td.wrap { overflow-wrap: anywhere; max-width: 36em; }
    .linkrow { border-top: 1px solid var(--line); padding-top: 12px; }
    .linkrow:first-of-type { border-top: 0; padding-top: 0; }
    .linkhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
    .linkbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .linktext { display: block; font: .8rem/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all;
      background: #F4F6F8; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: #17212B; }
    .qrbox { margin-top: 10px; text-align: center; }
    .qrbox svg { width: min(72vmin, 420px); height: auto; background: #fff; }
  </style>
  <!-- QR codes are drawn in the browser by qrcode-generator (MIT). If it can't load, the QR buttons are left out. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
  <header class="bar">
    <div style="flex:1 1 220px;min-width:0">
      <div class="tag"><a class="back" id="dashLink" href="#" target="_top" hidden>&larr; Dashboard</a><span class="crumb" id="dashSep" hidden aria-hidden="true"> / </span>Live board</div>
      <h1 id="title">Loading…</h1>
    </div>
    <div class="actions" id="barActions" hidden>
      <button type="button" class="btn btn-small btn-on-dark" id="copyLink">Copy table link</button>
      <a class="btn btn-small btn-on-dark" id="cardsLink" target="_blank" rel="noopener">Table cards</a>
      <a class="btn btn-small btn-on-dark" id="wallLink" target="_blank" rel="noopener">Open the wall</a>
    </div>
  </header>
  <nav class="stepper" id="stepper" aria-label="Agenda stage" hidden></nav>
  <main>
    <div id="pageError" class="alert alert-bad" role="alert"></div>
    <div id="view"></div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    /* shared:CaptureClient */
  /* Shared browser helpers for the live-capture pages. */
  var Capture = (function () {
    function run(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject(new Error(friendly(err))); });
        runner[name].apply(runner, args);
      });
    }

    function friendly(err) {
      var message = String(err && err.message || err || '');
      message = message.replace(/^(Exception|Error):\s*/i, '');
      if (!message || /NetworkError|failed to fetch/i.test(message)) return 'The connection dropped. Check the Wi-Fi and try again.';
      return message;
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    var toastTimer = null;
    function toast(message) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
    }

    /** Calls fn now and every ms while the page is visible; never overlaps. */
    function poll(fn, ms) {
      var busy = false, since = 0;
      function tick() {
        // A call that never answers (a phone that slept, Wi-Fi that stalled) must not stop the checking for good.
        if (document.hidden || (busy && Date.now() - since < 30000)) return;
        busy = true; since = Date.now();
        var mine = since;
        Promise.resolve().then(fn).catch(function () {}).then(function () { if (since === mine) busy = false; });
      }
      tick();
      setInterval(tick, ms);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }

    function store(key, value) {
      try {
        if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) { return null; }
    }

    return { run: run, esc: esc, toast: toast, poll: poll, store: store, friendly: friendly };
  })();
  /* /shared:CaptureClient */

    var SESSION_ID = "__SESSION_ID__";
    // Set when the dashboard links straight to a tab (After → Record & results).
    var START_TAB = "__TAB__";
    var $ = function (id) { return document.getElementById(id); };
    var esc = Capture.esc;
    var S = { board: null, groups: [], selected: null, dirty: 0, saving: false, saveTimer: null, savePromise: Promise.resolve(), saveFailed: false, seq: 0, moving: '', missed: 0, tab: '', tabChosen: false, lastStage: '', tableFilter: 'all', paper: null, audit: null, report: '' };
    var STAGE_TAB = { welcome: 'settings', signals: 'signals', flips: 'flips', flipdots: 'flips', needs: 'cards', synthesis: 'cards', vote: 'results', results: 'results', testdrive: 'testdrive', close: 'record' };
    var TABS = [['signals', 'Signals'], ['flips', 'Flip statements'], ['cards', 'Cards & groups'], ['results', 'Vote & results'], ['testdrive', 'Test drive'], ['record', 'Record & results'], ['settings', 'Settings & links']];
    // Which kind of paper each tab adds from, first choice first.
    var TAB_PAPER = { signals: ['signals'], flips: ['flips', 'flipdots'], cards: ['cards'], results: ['votes'], testdrive: ['testdrive'] };

    // ── Start ────────────────────────────────────────────────────────────────
    function start() {
      // Every facilitator page has a way back to the dashboard.
      Capture.run('webGetAppBaseUrl').then(function (u) { if (u) { $('dashLink').href = u; $('dashLink').hidden = $('dashSep').hidden = false; } }).catch(function () {});
      if (/^(signals|flips|cards|results|testdrive|record|settings)$/.test(START_TAB)) { S.tab = START_TAB; S.tabChosen = true; }
      if (!SESSION_ID) return pickSession();
      Capture.run('captureGetBoard', SESSION_ID).then(adopt).then(function () { Capture.poll(refresh, 6000); }).catch(showError);
    }
    function showError(err) { $('pageError').textContent = err.message || String(err); }
    function pickSession() {
      $('title').textContent = 'Choose a session';
      Promise.all([Capture.run('captureListSessions'), Capture.run('webGetAppBaseUrl')]).then(function (res) {
        var sessions = res[0], base = res[1] || '';
        $('view').innerHTML = '<section class="panel setup"><h2>Which session is this for?</h2>' +
          (sessions.length ? '<ul class="sessions">' + sessions.map(function (s) {
            return '<li class="panel"><a href="' + esc(base + '?page=board&session=' + encodeURIComponent(s.id)) + '"><strong>' + esc(s.name) + '</strong><br><span class="muted small">' + esc(s.date || '') + '</span></a></li>';
          }).join('') + '</ul>' : '<p class="empty">No sessions yet.</p>') + '</section>';
      }).catch(showError);
    }

    function adopt(board) {
      S.board = board;
      $('title').textContent = board.enabled ? board.config.title + ' · ' + board.sessionName : board.sessionName;
      // The turn-on form is drawn once, so a check-in doesn't put back what someone typed in it.
      if (!board.enabled) { if (!$('setupForm')) renderSetup(); return; }
      if (!S.dirty && !S.saving) {
        var pending = S.groups.filter(function (g) { return g.isNew && !g.cardIds.length; });
        S.groups = board.groups.map(function (g) { return { id: g.id, topic: g.topic, cardIds: g.cardIds.slice(), rank: g.rank, columnOverride: g.columnOverride || '' }; }).concat(pending);
      }
      if (board.config.stage !== S.lastStage) { S.lastStage = board.config.stage; if (!S.tabChosen) S.tab = STAGE_TAB[board.config.stage] || 'cards'; }
      // Redrawing keeps a long list where the facilitator had scrolled it.
      var feed = document.querySelector('.feed'), at = feed ? feed.scrollTop : 0;
      renderAll();
      feed = document.querySelector('.feed'); if (feed && at) feed.scrollTop = at;
    }

    // S.seq goes up with everything the board itself does, so a check-in that
    // left before an action and came back after it is recognised as older.
    function refresh() {
      var seq = S.seq;
      return Capture.run('captureGetBoard', SESSION_ID).then(function (board) {
        S.missed = 0;
        if ($('pageError').dataset.poll) { $('pageError').textContent = ''; delete $('pageError').dataset.poll; }
        if (seq !== S.seq) return;
        var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
        var paperShown = S.paper && S.paper.open && (TAB_PAPER[S.tab] || []).indexOf(S.paper.mode) !== -1;
        if (typing || S.dirty || S.saving || paperShown) { S.board = board; renderStepper(); return; }
        adopt(board);
      }, function (err) {
        S.missed = (S.missed || 0) + 1;
        if (S.missed >= 2) { $('pageError').textContent = 'This board is not updating: ' + err.message; $('pageError').dataset.poll = '1'; }
      });
    }

    function renderSetup() {
      $('barActions').hidden = true; $('stepper').hidden = true;
      Capture.run('captureListTemplates').then(function (templates) {
        $('view').innerHTML = '<form class="panel setup" id="setupForm"><h2>Turn on live capture</h2>' +
          '<div><label for="tpl">Activity</label><select id="tpl">' + templates.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select></div>' +
          '<div><label for="ttl">Title people will see</label><input type="text" id="ttl" maxlength="80" value="' + esc(templates[0] ? templates[0].name : '') + '"></div>' +
          '<div><label for="tbl">Number of tables</label><input type="number" id="tbl" min="1" max="40" value="6" style="max-width:8rem"></div>' +
          '<button class="btn btn-primary" type="submit">Turn on</button></form>';
        $('setupForm').onsubmit = function (e) {
          e.preventDefault();
          Capture.run('captureEnable', SESSION_ID, $('tpl').value, Number($('tbl').value), $('ttl').value).then(function (b) { S.seq++; adopt(b); }).catch(showError);
        };
      }).catch(showError);
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function T() { return S.board.template; }
    function cardById(id) { return S.board.cards.find(function (c) { return c.id === id; }); }
    function liveCards() { return S.board.cards.filter(function (c) { return !c.hidden; }); }
    function roleLabel(code) { var r = T().roles.find(function (x) { return x.code === code; }); return r ? r.label : '–'; }
    function levelOpt(code) { return T().level.options.find(function (o) { return o.code === code; }) || { route: 'vote', label: code }; }
    function perTable(list) { var out = []; for (var t = 1; t <= S.board.config.tables; t++) out.push(list.filter(function (x) { return x.table === t; }).length); return out; }
    function tablePills(list, unit) { return '<div class="chips">' + perTable(list).map(function (n, i) { return '<span class="pill' + (n ? '' : ' zero') + '">T' + (i + 1) + ' · ' + n + '</span>'; }).join('') + '</div>'; }
    function roleSplit(list) { return T().roles.map(function (r) { return esc(r.label) + ' ' + list.filter(function (x) { return x.role === r.code; }).length; }).join(' · '); }
    function call(name) {
      var args = Array.prototype.slice.call(arguments);
      S.seq++;
      return Capture.run.apply(null, args).then(function (b) {
        S.seq++;
        // Someone typing the next number is not interrupted by the answer to the last one.
        var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'checkbox';
        if (typing) { S.board = b; renderStepper(); } else adopt(b);
        return b;
      }).catch(function (e) { Capture.toast(e.message); throw e; });
    }

    // ── Layout ───────────────────────────────────────────────────────────────
    function renderAll() {
      var b = S.board;
      $('barActions').hidden = false;
      if (b.links) { $('wallLink').href = b.links.wall; $('cardsLink').href = b.links.tableCards; }
      $('wallLink').hidden = $('cardsLink').hidden = $('copyLink').hidden = !b.links;
      renderStepper();
      var tabs = '<div class="tabs" role="tablist">' + TABS.map(function (t) {
        return '<button type="button" class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      var body = { signals: tabSignals, flips: tabFlips, cards: tabCards, results: tabResults, testdrive: tabTestDrive, record: tabRecord, settings: tabSettings }[S.tab] || tabCards;
      $('view').innerHTML = tabs + '<div id="paperArea"></div><div id="tabBody"></div>';
      body();
      renderPaper();
    }

    function renderStepper() {
      var b = S.board;
      $('stepper').hidden = false;
      $('stepper').innerHTML = T().stages.map(function (s) {
        // While a move is on its way the bar shows where the room is going and takes no more clicks.
        var here = (S.moving || b.config.stage) === s.id;
        return '<button type="button" class="step" data-stage="' + esc(s.id) + '"' + (here ? ' aria-current="step"' : '') + (S.moving ? ' disabled' : '') + '><span class="l">' + esc(s.label) + (S.moving === s.id ? '…' : '') + '</span></button>';
      }).join('');
    }

    function body(html) { $('tabBody').innerHTML = html; }

    // Signals ------------------------------------------------------------------
    function tabSignals() {
      var sig = S.board.signals, live = sig.filter(function (s) { return !s.hidden; });
      body('<section class="panel summary"><span><span class="big num">' + live.length + '</span> signals</span>' + tablePills(live) + '<span class="small">' + roleSplit(live) + '</span></section>' +
        '<section class="panel section"><div class="head"><h2>Signals, newest first</h2></div><ol class="list feed">' + (sig.length ? sig.slice().reverse().map(function (s) {
          return '<li class="' + (s.hidden ? 'is-hidden' : '') + '"><span class="text">' + esc(s.text) + '</span><span class="meta">T' + s.table + ' · ' + esc(roleLabel(s.role)) + (s.source && s.source !== 'typed' ? ' · ' + esc(s.source) : '') + '</span>' +
            '<button type="button" class="btn btn-quiet btn-small" data-hide-signal="' + s.id + '" data-hidden="' + s.hidden + '">' + (s.hidden ? 'Show' : 'Hide') + '</button></li>';
        }).join('') : '<li class="empty">No signals yet.</li>') + '</ol></section>');
    }

    // Flips --------------------------------------------------------------------
    function tabFlips() {
      var flips = S.board.flips, live = flips.filter(function (f) { return !f.hidden; });
      var html = '<section class="panel summary"><span><span class="big num">' + live.length + '</span> ' + esc(T().parent.plural) + '</span>' + tablePills(live) + '</section>';
      for (var t = 1; t <= S.board.config.tables; t++) {
        var mine = flips.filter(function (f) { return f.table === t; });
        html += '<section class="panel section"><div class="head"><h2>Table ' + t + '</h2></div><ol class="list">' + (mine.length ? mine.map(function (f) {
          var dots = T().flipDots.map(function (d) { var n = f.dots && f.dots[d.code] ? f.dots[d.code] : null;
            return '<span class="pill"><span class="sw sw-' + d.code + '" aria-hidden="true"></span> ' + esc(d.label) + ' ' + (n ? n.total : 0) +
              (n ? ' (' + T().roles.map(function (r) { return r.code + ' ' + (n[r.code] || 0); }).join(', ') + ')' : '') + '</span>'; }).join('');
          return '<li class="' + (f.hidden ? 'is-hidden' : '') + '" style="display:block"><div style="display:flex;gap:8px"><span class="text">' + (f.top ? '<strong style="color:var(--good)">TOP</strong> ' : '') + esc(f.text) + '</span>' +
            '<button type="button" class="btn btn-quiet btn-small" data-hide-flip="' + f.id + '" data-hidden="' + f.hidden + '">' + (f.hidden ? 'Show' : 'Hide') + '</button></div><div class="chips" style="margin-top:6px">' + dots + '</div></li>';
        }).join('') : '<li class="empty">None yet.</li>') + '</ol></section>';
      }
      body(html);
    }

    // Cards and groups ---------------------------------------------------------
    function grouped() { var s = {}; S.groups.forEach(function (g) { g.cardIds.forEach(function (id) { s[id] = true; }); }); return s; }
    function ungrouped() { var s = grouped(); return liveCards().filter(function (c) { return !s[c.id]; }).map(function (c) { return c.id; }); }
    function stats(g) {
      var tables = {}, levels = {}, roles = {};
      T().level.options.forEach(function (o) { levels[o.code] = 0; });
      T().roles.forEach(function (r) { roles[r.code] = 0; });
      g.cardIds.forEach(function (id) { var c = cardById(id); if (!c || c.hidden) return; tables[c.table] = 1; if (levels[c.level] !== undefined) levels[c.level]++; if (roles[c.role] !== undefined) roles[c.role]++; });
      var majority = T().level.options[0].code;
      T().level.options.forEach(function (o) { if (levels[o.code] > levels[majority]) majority = o.code; });
      var tagged = T().level.options.filter(function (o) { return levels[o.code] > 0; }).length;
      return { tableCount: Object.keys(tables).length, levels: levels, roles: roles, contested: tagged > 1, auto: majority, column: g.columnOverride || majority };
    }
    function chip(id) {
      var c = cardById(id); if (!c || c.hidden) return '';
      var text = c.fields[T().fields[0].key];
      return '<button type="button" class="chip" draggable="true" data-card="' + id + '" aria-pressed="' + (S.selected === id) + '" title="' + esc(text) + ' (flip: ' + esc(c.fields[T().parent.key]) + ')">' +
        '<span class="t">#' + id + ' T' + c.table + ' ' + esc(c.level) + ' ' + esc(c.role) + '</span><span class="x">' + esc(text) + '</span></button>';
    }
    function moveHere(target) { return S.selected != null ? '<button type="button" class="btn btn-small" data-move="' + esc(target) + '">Move #' + S.selected + ' here</button>' : ''; }

    function tabCards() {
      var live = liveCards(), pub = S.board.published;
      var levels = T().level.options.map(function (o) { return '<span class="pill"><strong>' + esc(o.code) + '</strong> ' + live.filter(function (c) { return c.level === o.code; }).length + '</span>'; }).join('');
      var key = T().fields[0].key;
      var feed = S.board.cards.slice().reverse().filter(function (c) { return S.tableFilter === 'all' ? !c.hidden : S.tableFilter === 'hidden' ? c.hidden : (!c.hidden && c.table === Number(S.tableFilter)); });
      var filterOpts = '<option value="all">All tables</option><option value="hidden">Hidden</option>';
      for (var t = 1; t <= S.board.config.tables; t++) filterOpts += '<option value="' + t + '">Table ' + t + '</option>';
      body('<section class="panel summary"><span><span class="big num">' + live.length + '</span> cards</span>' + tablePills(live) + '<span class="chips">' + levels + '</span><span class="small">' + roleSplit(live) + '</span></section>' +
        '<div class="two"><section class="panel section"><div class="head"><h2>Cards, word for word</h2><label class="sr-only" for="filter">Show</label><select id="filter" style="width:auto">' + filterOpts + '</select></div>' +
        '<ol class="list feed">' + (feed.length ? feed.map(function (c) {
          return '<li class="' + (c.hidden ? 'is-hidden' : '') + '" style="display:block"><div class="meta"><strong>#' + c.id + '</strong> T' + c.table + ' · <span class="level" data-route="' + levelOpt(c.level).route + '">' + esc(c.level) + '</span> · ' + esc(roleLabel(c.role)) + ' · ' + esc(c.source) +
            ' <button type="button" class="btn btn-quiet btn-small" data-hide="' + c.id + '" data-hidden="' + c.hidden + '">' + (c.hidden ? 'Show' : 'Hide') + '</button></div>' +
            '<div style="font-weight:600;margin-top:4px;overflow-wrap:anywhere">' + esc(c.fields[key]) + '</div><div class="muted small" style="overflow-wrap:anywhere">' + (esc(c.fields[T().parent.key]) || '<em>Not under a statement</em>') + '</div>' +
            (c.aiReading && c.aiReading !== c.fields[key] ? '<div class="read-as">AI read: “' + esc(c.aiReading) + '”</div>' : '') +
            (c.photo ? '<div class="read-as"><a href="' + esc(c.photo) + '" target="_blank" rel="noopener">Photo</a></div>' : '') + '</li>';
        }).join('') : '<li class="empty">No cards yet.</li>') + '</ol></section>' +
        '<section class="panel section"><div class="head"><h2>Groups</h2><div class="chips">' +
          '<button type="button" class="btn btn-primary btn-small" id="suggestBtn">Suggest groups</button><button type="button" class="btn btn-small" id="newGroupBtn">New group</button>' +
          '<button type="button" class="btn btn-small" id="postersBtn">Make posters</button></div></div>' +
          '<div class="publish-row"><button type="button" class="btn btn-primary btn-small" id="publishBtn">' + (pub ? 'Publish again' : 'Publish for voting') + '</button>' +
          '<span class="small">' + (pub ? 'Published ' + new Date(S.board.config.publishedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ': ' + pub.length + ' groups. Phones and the wall show the published version.' : 'Phones and the wall see groups only after you publish.') + '</span></div>' +
          '<p class="muted small" style="margin:0 0 10px">AI drafts the groups. The column is the tag most of a group’s cards carry; <span class="contested">?</span> means tables tagged them differently. Counts always come from the cards.</p>' +
          '<div id="posters" aria-live="polite"></div><div id="groupsArea"></div></section></div>');
      $('filter').value = S.tableFilter;
      $('filter').onchange = function () { S.tableFilter = this.value; tabCards(); };
      $('suggestBtn').onclick = suggest; $('newGroupBtn').onclick = newGroup; $('postersBtn').onclick = posters; $('publishBtn').onclick = publish;
      renderGroups();
    }

    function renderGroups() {
      var area = $('groupsArea'); if (!area) return;
      var rest = ungrouped();
      var html = '<div class="tray" data-drop="tray"><div class="head" style="margin:0 0 6px"><strong>Doesn’t fit yet <span class="muted num">(' + rest.length + ')</span></strong>' + moveHere('tray') + '</div>' +
        '<div class="gchips">' + (rest.length ? rest.map(chip).join('') : '<span class="muted small">Every card is in a group.</span>') + '</div></div><div class="cols">';
      T().level.options.forEach(function (o) {
        var inCol = S.groups.map(function (g, i) { return { g: g, i: i, s: stats(g) }; }).filter(function (x) { return x.s.column === o.code; });
        html += '<div class="col" data-col="' + esc(o.code) + '"><h3><span class="level" data-route="' + o.route + '">' + esc(o.code) + '</span>' + esc(o.label) +
          '<span class="muted small">' + (o.route === 'parking' ? esc(T().routes.parking) : '') + '</span></h3>' +
          (inCol.length ? inCol.map(function (x) { return groupHtml(x.g, x.i, x.s); }).join('') : '<p class="muted small" style="margin:4px">No groups.</p>') + '</div>';
      });
      area.innerHTML = html + '</div>';
    }

    function groupHtml(g, i, s) {
      var colOpts = '<option value=""' + (g.columnOverride ? '' : ' selected') + '>' + esc(s.auto) + ' (auto)</option>' + T().level.options.map(function (o) {
        return '<option value="' + esc(o.code) + '"' + (g.columnOverride === o.code ? ' selected' : '') + '>' + esc(o.code) + '</option>'; }).join('');
      return '<article class="group" data-drop="' + esc(g.id) + '"><div class="group-head">' +
        '<span class="order"><button type="button" class="btn" data-up="' + i + '" aria-label="Move group up"' + (i ? '' : ' disabled') + '>▲</button>' +
        '<button type="button" class="btn" data-down="' + i + '" aria-label="Move group down"' + (i < S.groups.length - 1 ? '' : ' disabled') + '>▼</button></span>' +
        '<input type="text" class="topic" data-topic="' + esc(g.id) + '" value="' + esc(g.topic) + '" maxlength="80" aria-label="Topic name">' +
        '<select class="colsel" data-col-for="' + esc(g.id) + '" aria-label="Column">' + colOpts + '</select></div>' +
        '<div class="gstats">' + (s.contested ? '<span class="contested" title="Tables tagged these cards differently">?</span>' : '') +
        '<span>' + s.tableCount + (s.tableCount === 1 ? ' table' : ' tables') + '</span><span>· ' + T().level.options.map(function (o) { return esc(o.code) + ' ' + s.levels[o.code]; }).join(' ') + '</span>' +
        '<span>· ' + T().roles.map(function (r) { return esc(r.code) + ' ' + s.roles[r.code]; }).join(' ') + '</span></div>' +
        '<div class="gchips">' + g.cardIds.map(chip).join('') + '</div><div class="gfoot">' + moveHere(g.id) + '<span></span><button type="button" class="btn btn-quiet btn-small" data-delete="' + esc(g.id) + '">Remove group</button></div></article>';
    }

    function changed() { S.dirty++; S.seq++; clearTimeout(S.saveTimer); S.saveTimer = setTimeout(save, 700); }
    // Resolves when every edit so far is saved, or when a save has failed
    // (S.dirty is then still set, and the save is tried again shortly).
    function save() {
      if (S.saving) return S.savePromise.then(function () { return S.dirty && !S.saveFailed ? save() : null; });
      if (!S.dirty) return Promise.resolve();
      clearTimeout(S.saveTimer);
      var version = S.dirty; S.saving = true; S.saveFailed = false; S.seq++;
      var payload = S.groups.map(function (g, i) { return { id: g.id, topic: g.topic, cardIds: g.cardIds, rank: i + 1, columnOverride: g.columnOverride || '' }; });
      S.savePromise = Capture.run('captureSaveGroups', SESSION_ID, payload).then(function (b) {
        S.board = b; S.saving = false; S.seq++;
        if (S.dirty === version) { S.dirty = 0; return null; }
        return save();
      }, function (e) {
        S.saving = false; S.saveFailed = true;
        Capture.toast('Groups not saved yet: ' + e.message + ' Trying again.');
        clearTimeout(S.saveTimer); S.saveTimer = setTimeout(save, 3000);
      });
      return S.savePromise;
    }
    // Publishing and posters use the groups as saved, so the last edit must be in first.
    function saved() {
      clearTimeout(S.saveTimer);
      return save().then(function () { if (S.dirty) throw new Error('The last change to the groups is not saved yet. Try again in a moment.'); });
    }
    function move(cardId, target) {
      S.groups.forEach(function (g) { g.cardIds = g.cardIds.filter(function (id) { return id !== cardId; }); });
      if (target !== 'tray') { var g = S.groups.find(function (x) { return x.id === target; }); if (g) g.cardIds.push(cardId); }
      S.groups.forEach(function (g) { if (g.cardIds.length) delete g.isNew; });
      S.groups = S.groups.filter(function (g) { return g.cardIds.length || g.isNew; });
      S.selected = null; renderGroups(); changed();
    }
    function newGroup() {
      var id = 'n' + Date.now().toString(36);
      S.groups.push({ id: id, topic: 'New group', cardIds: [], rank: 0, columnOverride: '', isNew: true });
      if (S.selected != null) move(S.selected, id); else renderGroups();
      var input = document.querySelector('[data-topic="' + id + '"]'); if (input) { input.focus(); input.select(); }
    }
    function suggest() {
      if (S.groups.length && !confirm('Replace the current groups with a new AI draft?')) return;
      var btn = $('suggestBtn'); btn.disabled = true; btn.textContent = 'Drafting…';
      S.seq++;
      Capture.run('captureSuggestGroups', SESSION_ID).then(function (b) { S.dirty = 0; S.seq++; adopt(b); Capture.toast('AI draft ready. Rename, move and re-column as you like, then publish.'); })
        .catch(function (e) { Capture.toast(e.message); }).then(function () { var x = $('suggestBtn'); if (x) { x.disabled = false; x.textContent = 'Suggest groups'; } });
    }
    function publish() {
      var hasVotes = S.board.voters && S.board.voters.total > 0;
      var clear = false;
      if (S.board.published && hasVotes) {
        if (!confirm(S.board.voters.total + ' people have voted. Publish again and keep votes for groups that still exist?')) return;
        clear = confirm('Also clear all votes and start the vote over?');
      }
      var btn = $('publishBtn'); if (btn) btn.disabled = true;
      saved().then(function () { return call('capturePublish', SESSION_ID, clear).catch(function () { throw null; }); })
        .then(function () { Capture.toast('Published. Move to the Vote stage when you’re ready.'); })
        .catch(function (e) { if (e) Capture.toast('Not published. ' + e.message); })
        .then(function () { var x = $('publishBtn'); if (x) x.disabled = false; });
    }
    function posters() {
      var btn = $('postersBtn'); btn.disabled = true; btn.textContent = 'Making…';
      saved().then(function () { return Capture.run('captureMakePosters', SESSION_ID); })
        .then(function (r) { $('posters').innerHTML = '<div class="alert alert-good">Posters are ready. <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open the slides</a> to print.</div>'; })
        .catch(function (e) { $('posters').innerHTML = '<div class="alert alert-bad">' + esc(e.message) + '</div>'; })
        .then(function () { btn.disabled = false; btn.textContent = 'Make posters'; });
    }

    // Vote and results ---------------------------------------------------------
    function tabResults() {
      var b = S.board, pub = b.published;
      if (!pub) { body('<section class="panel section"><h2>Nothing published yet</h2><p>Group the cards on <strong>Cards & groups</strong>, then publish them for voting.</p></section>'); return; }
      var modes = [['phone', 'Device votes'], ['paper', 'Paper dots'], ['both', 'Both added together']];
      var html = '<section class="panel summary"><span><span class="big num">' + b.voters.total + '</span> people voted on a device</span><span class="small">' +
        T().roles.map(function (r) { return esc(r.label) + ' ' + (b.voters[r.code] || 0); }).join(' · ') + '</span>' +
        '<label class="small" for="mode" style="margin:0 0 0 auto">Count from</label><select id="mode" style="width:auto">' + modes.map(function (m) {
          return '<option value="' + m[0] + '"' + (b.config.tallyMode === m[0] ? ' selected' : '') + '>' + m[1] + '</option>'; }).join('') + '</select></section>';
      b.results.columns.forEach(function (col) {
        if (!col.items.length) return;
        html += '<section class="panel section"><div class="head"><h2><span class="level" data-route="' + col.route + '">' + esc(col.code) + '</span> ' + esc(col.label) +
          (col.route === 'parking' ? ' <span class="muted small">' + esc(T().routes.parking) + '</span>' : '') + '</h2></div><table class="tally"><thead><tr><th class="num">Rank</th><th>Topic</th>' +
          T().roles.map(function (r) { return '<th class="num">Device ' + esc(r.code) + '</th>'; }).join('') + T().roles.map(function (r) { return '<th class="num">Paper ' + esc(r.code) + '</th>'; }).join('') +
          '<th class="num" title="Paper dots not marked as a student’s or an adult’s. They count toward the total.">Paper ?</th><th class="num">Total</th></tr></thead><tbody>' + col.items.map(function (i) {
            var t = b.tally[i.id] || { phone: {}, paper: {} };
            return '<tr><td class="num">' + i.rank + '</td><td>' + esc(i.topic) + (i.contested ? ' <span class="contested">?</span>' : '') + '</td>' +
              T().roles.map(function (r) { return '<td class="num">' + (t.phone[r.code] || 0) + '</td>'; }).join('') +
              T().roles.map(function (r) { return '<td class="num"><label class="sr-only" for="pd_' + esc(i.id) + '_' + r.code + '">Paper ' + esc(r.label) + ' dots for ' + esc(i.topic) + '</label><input type="number" min="0" max="999" id="pd_' + esc(i.id) + '_' + r.code + '" data-paper="' + esc(i.id) + '" value="' + (t.paper[r.code] || 0) + '"></td>'; }).join('') +
              '<td class="num"><label class="sr-only" for="pd_' + esc(i.id) + '_unmarked">Paper dots not marked student or adult for ' + esc(i.topic) + '</label><input type="number" min="0" max="999" id="pd_' + esc(i.id) + '_unmarked" data-paper="' + esc(i.id) + '" value="' + (t.paper.unmarked || 0) + '"></td>' +
              '<td class="num"><strong>' + i.total + '</strong></td></tr>';
          }).join('') + '</tbody></table></section>';
      });
      var priorities = b.results.priorities;
      html += '<section class="panel section"><div class="head"><h2>Table assignments</h2><span class="muted small">The top ' + b.config.tables + ' priorities go to tables in order. Change any by hand.</span></div><table class="tally"><tbody>' +
        b.results.assignments.map(function (a) {
          return '<tr><th scope="row">Table ' + a.table + '</th><td><label class="sr-only" for="as' + a.table + '">Priority for table ' + a.table + '</label><select id="as' + a.table + '" data-assign="' + a.table + '" style="width:100%">' +
            '<option value="">Automatic' + (a.manual ? '' : ': ' + esc(a.topic || 'none')) + '</option>' + priorities.map(function (p) {
              return '<option value="' + esc(p.id) + '"' + (a.manual && a.groupId === p.id ? ' selected' : '') + '>' + esc(p.topic) + ' (' + p.total + ')</option>'; }).join('') + '</select></td></tr>';
        }).join('') + '</tbody></table></section>';
      body(html);
      $('mode').onchange = function () { call('captureSetTallyMode', SESSION_ID, this.value); };
    }

    // Test drive ---------------------------------------------------------------
    function tabTestDrive() {
      var b = S.board, notes = b.testDrive || [];
      var html = '';
      var assignments = b.results ? b.results.assignments : [];
      for (var t = 1; t <= b.config.tables; t++) {
        var a = assignments.find(function (x) { return x.table === t; }), mine = notes.filter(function (x) { return x.table === t; });

    document.addEventListener('change', function (e) {
      var d = e.target.dataset || {};
      if (S.paper && e.target.id === 'paperPhoto') { var f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) readPaperPhoto(f); return; }
      if (S.paper && e.target.id === 'paperTable') { S.paper.table = Number(e.target.value) || 1; S.paper.rows.forEach(function (r) { if (r.table !== undefined) { if (S.paper.mode === 'cards' && r.table !== S.paper.table) r.flipId = 0; r.table = S.paper.table; } }); return renderPaper(); }
      if (d.prow !== undefined && S.paper) return setPaperField(Number(d.prow), d.pf, e.target);
      if (d.colFor) { var g = S.groups.find(function (x) { return x.id === d.colFor; }); if (g) { g.columnOverride = e.target.value; renderGroups(); changed(); } return; }
      if (d.paper) {
        var counts = {};
        T().roles.forEach(function (r) { var el = $('pd_' + d.paper + '_' + r.code); counts[r.code] = el ? Number(el.value) || 0 : 0; });
        var un = $('pd_' + d.paper + '_unmarked'); if (un) counts.unmarked = Number(un.value) || 0;
        return call('captureSetPaperDots', SESSION_ID, d.paper, counts).catch(function () {});
      }
      if (d.assign) return call('captureSetAssignment', SESSION_ID, Number(d.assign), e.target.value).catch(function () {});
    });

    document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('[data-card]'); if (c) e.dataTransfer.setData('text/plain', c.dataset.card); });
    document.addEventListener('dragover', function (e) {
      var z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
      e.preventDefault(); document.querySelectorAll('.drop').forEach(function (x) { if (x !== z) x.classList.remove('drop'); }); z.classList.add('drop');
    });
    document.addEventListener('drop', function (e) {
      var z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
      e.preventDefault(); var id = Number(e.dataTransfer.getData('text/plain')); if (id) move(id, z.dataset.drop);
    });
    document.addEventListener('dragend', function () { document.querySelectorAll('.drop').forEach(function (x) { x.classList.remove('drop'); }); });

    start();
  </script>

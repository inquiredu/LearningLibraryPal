<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    /* shared:CaptureStyles */
  :root {
    --ink: #17212B;
    --muted: #4F5D6B;
    /* State of Minnesota brand: Minnesota Blue and Minnesota Green. */
    --navy: #003865;
    --navy-2: #0D4E80;
    --cyan: #78BE21;
    --ground: #F4F6F8;
    --surface: #FFFFFF;
    --line: #D5DCE3;
    --line-strong: #9AA7B4;
    --focus: #1565C0;
    --good: #1E6B3A;
    --good-bg: #E6F2EA;
    --warn: #8A4B00;
    --warn-bg: #FFF3E0;
    --bad: #A1261B;
    --bad-bg: #FCEBEA;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(11, 43, 70, .08), 0 2px 8px rgba(11, 43, 70, .06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 17px/1.5 var(--font); color: var(--ink); background: var(--ground); }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.1rem; }
  p { margin: 0; }
  a { color: var(--focus); }
  ::selection { background: #CDE9F8; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }

  .bar { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .bar .tag { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: #CFE3F2; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font: 600 1rem/1.2 var(--font);
    cursor: pointer; text-decoration: none; background: var(--surface); color: var(--navy); border-color: var(--line-strong); }
  .btn:hover { border-color: var(--navy); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-quiet { background: transparent; border-color: transparent; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; padding-inline: 6px; }
  .btn-on-dark { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .btn-small { min-height: 36px; padding: 6px 10px; font-size: .875rem; }
  .btn-block { width: 100%; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  label, .label { display: block; font-weight: 650; margin-bottom: 4px; }
  .hint { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; font: 1rem/1.4 var(--font); color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 88px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--focus); }

  .alert { border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
  .alert-bad { background: var(--bad-bg); color: var(--bad); }
  .alert-good { background: var(--good-bg); color: var(--good); }
  .alert-warn { background: var(--warn-bg); color: var(--warn); }
  .alert:empty { display: none; }

  .level { display: inline-flex; align-items: center; justify-content: center; min-width: 2.4em; padding: 1px 7px;
    border-radius: 6px; font-weight: 700; font-size: .85rem; border: 1px solid var(--line-strong); background: #fff; color: var(--navy); }
  .level[data-route="parking"] { border-style: dashed; color: var(--warn); border-color: #C88A3A; }

  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .9s linear infinite; }
  .spinner.dark { border-color: rgba(0,56,101,.2); border-top-color: var(--navy); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow); z-index: 50; }
  .toast[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media print { .bar, .btn, .toast { display: none !important; } body { background: #fff; } }
  /* /shared:CaptureStyles */
  </style>
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 96px; }
    .stack > * + * { margin-top: 16px; }
    .block { padding: 16px; }
    .block + .block, section + section { margin-top: 16px; }
    .stage { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; background: #E8F1F8; border-radius: 10px; color: var(--navy); }
    .stage .what { font-weight: 650; }
    .stage p { color: var(--muted); font-size: .95rem; margin-top: 2px; }
    .grid-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; margin-top: 10px; }
    .grid-buttons .btn { min-height: 60px; font-size: 1.3rem; }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .roles .btn { min-height: 56px; }
    .btn[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .field-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .mic { min-height: 36px; padding: 4px 10px; font-size: .875rem; flex-shrink: 0; }
    .mic[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend { font-weight: 650; margin-bottom: 8px; padding: 0; }
    .opts { display: grid; gap: 8px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line-strong);
      border-radius: 8px; cursor: pointer; background: #fff; font-weight: 400; margin: 0; }
    .opt input { margin-top: 4px; width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--navy); }
    .opt:has(input:checked) { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
    .opt .code { font-weight: 800; min-width: 2.2em; color: var(--navy); }
    .opt .hint { margin: 0; }
    .list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
    .list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; }
    .list .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .list .meta { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .photo { display: grid; gap: 8px; }
    #photoInput:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
    .photo-preview { display: flex; gap: 12px; align-items: center; }
    .photo-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
    .dotrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .dot-btn { min-height: 40px; padding: 6px 10px; font-size: .875rem; border-radius: 999px; }
    .dot-btn .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
    .dot-btn[aria-pressed="true"] { background: var(--navy); color: #fff; }
    .sw-green { background: #2E8B57; } .sw-blue { background: #2F6FD0; } .sw-yellow { background: #E7B416; }
    .counts { display: flex; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .counts span { display: inline-flex; gap: 4px; align-items: center; }
    .flip { padding: 12px; }
    .flip .row { display: flex; gap: 8px; align-items: flex-start; }
    .flip .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .tag-top { font-size: .8rem; font-weight: 700; color: var(--good); }
    .col-head { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 6px; }
    .ballot-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }
    .ballot-item .topic { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .stepper { display: inline-flex; align-items: center; gap: 6px; }
    .stepper .btn { min-height: 40px; min-width: 40px; padding: 0; font-size: 1.2rem; }
    .stepper .n { min-width: 1.4em; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
    .remaining { position: sticky; bottom: 0; background: var(--ground); padding: 12px 0; display: flex; gap: 10px; align-items: center; }
    .remaining strong { flex: 1; }
    .contested { font-size: .8rem; font-weight: 800; color: var(--warn); border: 1px dashed #C88A3A; border-radius: 6px; padding: 0 5px; }
    .rank { font-weight: 800; color: var(--navy); min-width: 1.6em; font-variant-numeric: tabular-nums; }
    .split { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .mine { border: 2px solid var(--navy); }
    .big-topic { font-size: 1.3rem; font-weight: 800; color: var(--navy); margin-top: 4px; overflow-wrap: anywhere; }
    .also { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: .9rem; }
    .also .btn { min-height: 36px; padding: 4px 10px; font-size: .875rem; }
    .also .btn[aria-current="page"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .next-person { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
    .others { border-left: 3px solid var(--line-strong); padding-left: 10px; }
  </style>
</head>
<body>
  <header class="bar">
    <div style="flex:1;min-width:0">
      <div class="tag">Live capture</div>
      <h1 id="title">Loading…</h1>
    </div>
    <button type="button" id="whoBtn" class="btn btn-small btn-on-dark" hidden></button>
  </header>
  <main>
    <div id="pageError" class="alert alert-bad" role="alert"></div>
    <section id="who" class="panel block" hidden aria-labelledby="whoTitle">
      <h2 id="whoTitle">Before you start</h2>
      <p class="muted small" style="margin-top:4px">This device remembers your choices. You can change them later.</p>
      <h3 style="font-size:1rem;margin-top:16px">Which table are you at?</h3>
      <div class="grid-buttons" id="tablePick"></div>
      <h3 id="roleAsk" style="font-size:1rem;margin-top:16px">Are you a student or an adult?</h3>
      <div class="roles" id="rolePick"></div>
      <button type="button" class="btn btn-primary btn-block" id="whoDone" style="margin-top:16px">Continue</button>
    </section>
    <div id="stageBar" class="stage" hidden aria-live="polite"></div>
    <nav id="also" class="also" hidden aria-label="Other steps"></nav>
    <div id="view" style="margin-top:16px"></div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    /* shared:CaptureClient */
  /* Shared browser helpers for the live-capture pages. */
  var Capture = (function () {
    function run(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject(new Error(friendly(err))); });
        runner[name].apply(runner, args);
      });
    }

    function friendly(err) {
      var message = String(err && err.message || err || '');
      message = message.replace(/^(Exception|Error):\s*/i, '');
      if (!message || /NetworkError|failed to fetch/i.test(message)) return 'The connection dropped. Check the Wi-Fi and try again.';
      return message;
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    var toastTimer = null;
    function toast(message) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
    }

    /** Calls fn now and every ms while the page is visible; never overlaps. */
    function poll(fn, ms) {
      var busy = false, since = 0;
      function tick() {
        // A call that never answers (a phone that slept, Wi-Fi that stalled) must not stop the checking for good.
        if (document.hidden || (busy && Date.now() - since < 30000)) return;
        busy = true; since = Date.now();
        var mine = since;
        Promise.resolve().then(fn).catch(function () {}).then(function () { if (since === mine) busy = false; });
      }
      tick();
      setInterval(tick, ms);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }

    function store(key, value) {
      try {
        if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) { return null; }
    }

    return { run: run, esc: esc, toast: toast, poll: poll, store: store, friendly: friendly };
  })();
  /* /shared:CaptureClient */

    var SESSION_ID = "__SESSION_ID__";
    var CAPTURE_KEY = "__CAPTURE_KEY__";
    var PRESET_TABLE = Number("__TABLE__") || 0; // set when the link came from a printed table card
    var $ = function (id) { return document.getElementById(id); };
    var esc = Capture.esc;
    var K = 'capture:' + SESSION_ID + ':';
    var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    // view: a step someone opened on purpose (an earlier one, say); '' follows the room.
    var S = { state: null, stage: '', view: '', table: 0, role: '', voter: '', tokens: {}, busy: false, dots: null, ballot: null, sentBallot: '', drafts: {}, myNotes: null, sources: {}, readingEntry: 0 };

    function randomId() {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }
    // The person using this device right now. Next person gives a shared device a fresh one.
    function voterId() {
      var v = Capture.store(K + 'voter');
      if (!v || !/^[a-f0-9]{32}$/.test(v)) { v = randomId(); Capture.store(K + 'voter', v); }
      return v;
    }
    function nextPerson() {
      if (current() === 'vote' && S.ballot && used() && ballotKey() !== S.sentBallot) {
        return Capture.toast('Send your votes first, then tap Next person.');
      }
      flushDots(); // the last person's dots go out under their own id
      S.voter = randomId(); Capture.store(K + 'voter', S.voter);
      S.dots = []; S.ballot = {}; S.sentBallot = ''; S.drafts = {}; S.myNotes = null;
      if (S.state) { S.state.myDots = []; S.state.myVote = null; }
      S.role = ''; Capture.store(K + 'role', '');
      Capture.toast('Ready for the next person. Choose student or adult.');
      showWho();
    }

    function T() { return S.state.template; }
    // With need cards only, a table just opens the form: nobody is asked who they are first.
    function cardsOnly() { return S.state.template.flow === 'cards'; }
    function roleLabel(code) { var r = T().roles.find(function (x) { return x.code === code; }); return r ? r.label : ''; }
    function stageInfo(id) { return T().stages.find(function (s) { return s.id === id; }) || { label: id, phone: '' }; }

    // ── Loading and polling ──────────────────────────────────────────────────
    // fresh: right after this device changed something, so its change shows at once.
    var asked = 0, shown = 0;
    function load(force, fresh) {
      var n = ++asked;
      return Capture.run('captureGetPhoneState', SESSION_ID, CAPTURE_KEY, S.table, S.voter, !!fresh).then(function (state) {
        if (n < shown) return; // a slower, older answer: what's on screen is newer
        shown = n;
        $('pageError').textContent = '';
        var first = !S.stage, moved = state.stage !== S.stage, was = first ? '' : current();
        S.state = state;
        $('title').textContent = state.title;
        if (moved) S.stage = state.stage;
        if (force || first) { if (moved) S.view = ''; return render(); }
        if (!moved) return refreshLists();
        // The room moved on. Someone in the middle of writing or voting stays
        // where they are, with their words; everyone else follows the room.
        if (hasUnsent()) {
          S.view = was === S.stage ? '' : was;
          renderStageBar(); renderAlso(); refreshLists();
          Capture.toast('The room moved on to ' + stageInfo(S.stage).label + '. Finish here, then tap Back to now.');
        } else { S.view = ''; render(); }
      }).catch(function (err) { if (n >= shown) $('pageError').textContent = err.message; });
    }

    // Words or votes on this screen that haven't been sent yet.
    function hasUnsent() {
      var areas = $('view').querySelectorAll('textarea');
      for (var i = 0; i < areas.length; i++) {
        if (areas[i].dataset.editFlip) return true;
        if (areas[i].value.trim() !== String(areas[i].dataset.saved || '').trim()) return true;
      }
      return current() === 'vote' && !!S.ballot && used() > 0 && ballotKey() !== S.sentBallot;
    }
    // What's typed is kept when a screen is redrawn or someone looks at another step.
    function stashDrafts() {
      $('view').querySelectorAll('textarea[id]').forEach(function (a) { if (!a.dataset.editFlip) S.drafts[a.id] = a.value; });
      var level = document.querySelector('input[name="level"]:checked');
      if ($('cardSend')) S.drafts.level = level ? level.value : '';
    }
    function restoreDrafts() {
      $('view').querySelectorAll('textarea[id]').forEach(function (a) { if (typeof S.drafts[a.id] === 'string' && !a.dataset.editFlip) a.value = S.drafts[a.id]; });
      if (S.drafts.level) { var el = document.querySelector('input[name="level"][value="' + CSS.escape(S.drafts.level) + '"]'); if (el) el.checked = true; }
    }

    function start() {
      S.voter = voterId();
      S.tokens = Capture.store(K + 'tokens') || {};
      var savedTable = Number(Capture.store(K + 'table')) || 0;
      S.table = PRESET_TABLE || savedTable;
      S.role = Capture.store(K + 'role') || '';
      open(0);
    }
    // A whole room opens this at once, so a first try can fail on a good link: try again before saying so.
    function open(tries) {
      Capture.run('captureGetPhoneState', SESSION_ID, CAPTURE_KEY, 0, S.voter).then(function (state) {
        S.state = state;
        $('pageError').textContent = '';
        $('title').textContent = state.title;
        if (S.table > state.tables) S.table = 0;
        if (PRESET_TABLE && PRESET_TABLE <= state.tables) Capture.store(K + 'table', PRESET_TABLE);
        if (!S.table || (!cardsOnly() && !S.role)) return showWho();
        afterWho();
      }).catch(function (err) {
        if (/table link/i.test(err.message)) { $('title').textContent = 'Link not working'; $('pageError').textContent = err.message; return; }
        if (tries < 4) { $('pageError').textContent = 'Still connecting…'; return setTimeout(function () { open(tries + 1); }, 2500); }
        $('title').textContent = 'Not connected';
        $('pageError').innerHTML = esc(err.message) + ' <button type="button" class="btn btn-small" id="retryOpen">Try again</button>';
        $('retryOpen').onclick = function () { $('pageError').textContent = 'Connecting…'; open(0); };
      });
    }

    var polling = false;
    function afterWho() {
      $('who').hidden = true;
      $('whoBtn').hidden = false;
      $('whoBtn').textContent = 'Table ' + S.table + (S.role ? ' · ' + roleLabel(S.role) : '') + ' · change';
      load(true).then(function () { if (!polling) { polling = true; Capture.poll(function () { return load(false); }, 8000); } });
    }

    // ── Who: table and role ──────────────────────────────────────────────────
    function showWho() {
      stashDrafts();
      var st = S.state, html = '';
      for (var t = 1; t <= st.tables; t++) html += '<button type="button" class="btn" data-table="' + t + '" aria-pressed="' + (S.table === t) + '" aria-label="Table ' + t + '">' + t + '</button>';
      $('tablePick').innerHTML = html;
      $('rolePick').innerHTML = st.template.roles.map(function (r) {
        return '<button type="button" class="btn" data-role="' + esc(r.code) + '" aria-pressed="' + (S.role === r.code) + '">' + esc(r.label) + '</button>';
      }).join('');
      $('roleAsk').hidden = $('rolePick').hidden = cardsOnly();
      $('who').hidden = false; $('stageBar').hidden = true; $('also').hidden = true; $('view').innerHTML = ''; $('whoBtn').hidden = true;
    }
    $('tablePick').onclick = function (e) {
      var b = e.target.closest('[data-table]'); if (!b) return;
      S.table = Number(b.dataset.table);
      $('tablePick').querySelectorAll('[data-table]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    };
    $('rolePick').onclick = function (e) {
      var b = e.target.closest('[data-role]'); if (!b) return;
      S.role = b.dataset.role;
      $('rolePick').querySelectorAll('[data-role]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    };
    $('whoDone').onclick = function () {
      if (!S.table) return Capture.toast('Choose your table.');
      if (!S.role && !cardsOnly()) return Capture.toast('Choose student or adult.');
      Capture.store(K + 'table', S.table); Capture.store(K + 'role', S.role);
      afterWho();
    };
    $('whoBtn').onclick = showWho;

    // ── Rendering by stage ───────────────────────────────────────────────────
    // Steps people add to. Any of them stays open after the room moves on.
    var OPEN_STEPS = ['signals', 'flips', 'flipdots', 'needs', 'vote', 'testdrive'];
    function current() { return S.view || S.stage; }
    function renderStageBar() {
      var info = stageInfo(S.stage);
      $('stageBar').hidden = false;
      $('stageBar').innerHTML = '<div><div class="what">Now: ' + esc(info.label) + '</div><p>' + esc(info.phone) + '</p></div>';
    }
    function render() {
      stashDrafts();
      renderStageBar();
      renderAlso();
      drawView();
    }
    function drawView() {
      var views = { welcome: viewWelcome, signals: viewSignals, flips: viewFlips, flipdots: viewFlipDots, needs: viewNeeds,

        redrawKeepingPlace();
      }
      if (v === 'signals') renderSignalList();
      if (v === 'flips') renderFlipList();
      if (v === 'needs') { renderTopList(); renderFlipList(); renderCardList(); }

    // Gallery dots -------------------------------------------------------------
    function viewFlipDots() {

    function countDots() { var el = $('dotCount'); if (el) el.textContent = S.dots.length + (S.dots.length === 1 ? ' dot placed.' : ' dots placed.'); }
    // Dots save one at a time, in the order tapped, and keep trying if a save fails.

    function dotNote(text) { Dots.note = text; var el = $('dotNote'); if (el) el.textContent = text; }
    function saveDots() {
      Dots.waiting = { voter: S.voter, role: S.role, table: S.table,
        dots: S.dots.map(function (k) { var p = k.split(':'); return { flipId: Number(p[0]), color: p[1] }; }) };
      Dots.tries = 0;
      clearTimeout(Dots.timer);
      Dots.timer = setTimeout(flushDots, 600);
    }
    function flushDots() {
      clearTimeout(Dots.timer);
      if (!Dots.waiting || Dots.sending) return;
      var job = Dots.waiting;
      Dots.waiting = null; Dots.sending = true;
      Capture.run('captureSaveFlipDots', SESSION_ID, CAPTURE_KEY, job).then(function () {
        Dots.tries = 0;
        if (job.voter === S.voter && S.state) S.state.myDots = job.dots;
        if (!Dots.waiting) { dotNote(''); Capture.toast('Dots saved.'); }
      }, function (e) {
        Dots.tries++;
        if (!Dots.waiting) Dots.waiting = job;
        if (Dots.tries > 5) { dotNote('Not saved: ' + e.message + ' Tap any dot to try again.'); Dots.waiting = null; }
        else dotNote('Not saved yet. Trying again…');
      }).then(function () {
        Dots.sending = false;
        if (Dots.waiting) Dots.timer = setTimeout(flushDots, Dots.tries ? Math.min(8000, 1500 * Dots.tries) : 0);
      });
    }

    // Need cards ---------------------------------------------------------------
    function viewNeeds() {

          '<ol class="list" id="flipList"></ol>' + textField('flipText', 'Add a ' + p.label.toLowerCase(), '', p.maxLength) +

      }).join('');
      var roles = t.roles.map(function (r) {
        return '<label class="opt" style="padding:8px 12px"><input type="radio" name="cardRole" value="' + esc(r.code) + '"' + (r.code === S.role ? ' checked' : '') + '><span>' + esc(r.label) + '</span></label>';
      }).join('') + '<label class="opt" style="padding:8px 12px"><input type="radio" name="cardRole" value=""' + (S.role ? '' : ' checked') + '><span>Our table</span></label>';
      var f = t.fields[0];
      panel('<h2>Add a ' + esc(t.noun) + '</h2><p class="muted small">' + esc(t.intro) + '</p>' +
        '<fieldset><legend>Which ' + esc(t.parent.label.toLowerCase()) + ' is this card for?</legend><div class="opts" id="flipPick"></div></fieldset>' +
        (S.state.aiPhotos ? '<div class="photo"><input type="file" id="photoInput" accept="image/*" capture="environment" class="sr-only"><label for="photoInput" class="btn btn-block" style="margin:0">Read a photo of the card</label><span class="hint">On a phone this opens the camera; on a laptop, choose a photo file.</span><div id="photoStatus" class="alert" aria-live="polite"></div></div>' : '') +
        textField('needText', f.label, f.hint, f.maxLength) +
        '<fieldset><legend>' + esc(t.level.label) + '</legend><p class="hint">' + esc(t.level.levers) + '</p><div class="opts">' + levels + '</div></fieldset>' +
        '<fieldset><legend>Written by</legend><div class="opts" style="grid-template-columns:repeat(3,1fr)">' + roles + '</div></fieldset>' +
        '<div id="cardErr" class="alert alert-bad" role="alert"></div><button type="button" class="btn btn-primary btn-block" id="cardSend">Send card</button>');
      panel('<h2>Table ' + S.table + '’s cards</h2><ol class="list" id="cardList"></ol>');
      if ($('photoInput')) $('photoInput').addEventListener('change', readPhoto);
      $('needText').addEventListener('input', function (e) { if (e.isTrusted) S.sources.typed = true; });

    function dotCounts(f) {
      return T().flipDots.map(function (d) {

        return '<span><span class="sw sw-' + d.code + '" aria-hidden="true" style="width:10px;height:10px;border-radius:50%;display:inline-block"></span>' + esc(d.label) + ' ' + n + '</span>';
      }).join('');
    }
    function renderTopList() {
      var list = $('topList'); if (!list) return;
      var flips = (S.state.table && S.state.table.flips) || [];
      list.innerHTML = flips.length ? flips.map(function (f) {
        return '<li class="panel" style="display:block"><div class="row" style="display:flex;gap:8px"><span class="text">' + esc(f.text) + '</span>' +
          '<button type="button" class="btn btn-small" data-top="' + f.id + '" aria-pressed="' + !!f.top + '">' + (f.top ? 'Top ✓' : 'Mark top') + '</button></div>' +
          '<div class="counts">' + dotCounts(f) + '</div></li>';
      }).join('') : '<li class="muted">Your table has no ' + esc(T().parent.plural) + ' here yet. Cards can still be sent on their own.</li>';
    }
    function renderFlipPick() {
      var box = $('flipPick'); if (!box) return;
      var flips = (S.state.table && S.state.table.flips) || [];
      var chosen = (document.querySelector('input[name="flipId"]:checked') || {}).value;
      // A statement just written with a card stays chosen for the table's next card.
      if (S.pickFlip && flips.some(function (f) { return f.id === S.pickFlip; })) { chosen = String(S.pickFlip); S.pickFlip = 0; }
      var ordered = flips.filter(function (f) { return f.top; }).concat(flips.filter(function (f) { return !f.top; }));
      box.innerHTML = ordered.map(function (f, i) {
        var checked = chosen ? String(f.id) === chosen : i === 0;
        return '<label class="opt"><input type="radio" name="flipId" value="' + f.id + '"' + (checked ? ' checked' : '') + '><span>' + (f.top ? '<span class="tag-top">TOP</span> ' : '') + esc(f.text) + '</span></label>';
      }).join('') + '<label class="opt"><input type="radio" name="flipId" value="0"' + (chosen === '0' || !ordered.length ? ' checked' : '') + '><span>Not under a ' + esc(T().parent.label.toLowerCase()) + '</span></label>';
    }
    function renderCardList() {
      var list = $('cardList'); if (!list) return;

      var cards = (S.state.table && S.state.table.cards) || [];
      list.innerHTML = cards.length ? cards.map(function (c) {
        return '<li class="panel"><span class="level">' + esc(c.level) + '</span><span class="text">' + esc(c.text) + '</span><span class="meta">' + (roleLabel(c.role) ? esc(roleLabel(c.role)) + ' · ' : '') + '#' + c.id + '</span>' +
          (S.tokens['c' + c.id] ? '<button type="button" class="btn btn-quiet btn-small" data-rm-card="' + c.id + '">Remove</button>' : '') + '</li>';

    function sendCard() {
      var flip = document.querySelector('input[name="flipId"]:checked');
      var level = document.querySelector('input[name="level"]:checked');
      var role = document.querySelector('input[name="cardRole"]:checked');
      var need = $('needText').value.trim();
      var err = $('cardErr');
      // A flip statement typed but not yet saved is saved first, and the card goes under it.
      var typedFlip = cardsOnly() && $('flipText') ? $('flipText').value.trim() : '';
      if (!flip && !typedFlip) { err.textContent = 'Choose which ' + T().parent.label.toLowerCase() + ' this card is for, or none.'; return; }
      if (!need) { err.textContent = 'Write the need.'; $('needText').focus(); return; }
      if (!level) { err.textContent = 'Choose G, G+ or B.'; return; }
      var fields = {}; fields[T().fields[0].key] = need;
      busy($('cardSend'), true, 'Sending…');
      var under = typedFlip
        ? Capture.run('captureSaveFlip', SESSION_ID, CAPTURE_KEY, S.table, 0, typedFlip, S.voter).then(function (r) { if ($('flipText')) $('flipText').value = ''; S.drafts.flipText = ''; S.pickFlip = r.id; return r.id; })
        : Promise.resolve(Number(flip.value));
      under.then(function (flipId) { return Capture.run('captureSubmitCard', SESSION_ID, CAPTURE_KEY, { table: S.table, flipId: flipId, fields: fields, level: level.value,
        role: role ? role.value : S.role, sources: Object.keys(S.sources), device: S.voter, readingEntry: S.sources.photo ? S.readingEntry : 0 }); }).then(function (res) {
        S.tokens['c' + res.id] = res.token; Capture.store(K + 'tokens', S.tokens);
        $('needText').value = ''; level.checked = false; S.drafts.level = ''; S.sources = {}; S.readingEntry = 0; err.textContent = '';
        if ($('photoStatus')) { $('photoStatus').className = 'alert'; $('photoStatus').textContent = ''; }
        Capture.toast('Card ' + res.id + ' sent. Sharing this device? Pass it on.');
        load(false, true);
      }).catch(function (e) { sendFailed(err, e); }).then(function () { busy($('cardSend'), false, 'Send card'); });
    }
    function shrink(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That photo couldn’t be opened. Type the card instead.')); };
        img.src = url;
      });
    }
    function readPhoto() {
      var file = this.files && this.files[0]; this.value = '';
      if (!file) return;
      var st = $('photoStatus'), typedBefore = $('needText').value;
      st.className = 'alert'; st.innerHTML = '<span class="photo-preview"><span class="spinner dark" aria-hidden="true"></span> Reading the card…</span>';
      shrink(file).then(function (dataUrl) {
        return Capture.run('captureReadPhoto', SESSION_ID, CAPTURE_KEY, dataUrl.split(',')[1], 'image/jpeg', S.table, S.voter);
      }).then(function (r) {
        if (r.empty) { st.className = 'alert alert-warn'; st.textContent = 'No writing found. Try again closer, or type it.'; return; }
        S.readingEntry = r.entry || 0;
        var k = T().fields[0].key, box = $('needText');
        if (!box) return;
        st = $('photoStatus') || st;
        // Words typed while the photo was being read are kept, with the reading after them.
        if (r.fields[k]) box.value = box.value !== typedBefore && box.value.trim() ? box.value.replace(/\s*$/, ' ') + r.fields[k] : r.fields[k];
        if (r.level) { var el = document.querySelector('input[name="level"][value="' + CSS.escape(r.level) + '"]'); if (el) el.checked = true; }
        S.sources.photo = true;
        var unclear = String(r.fields[k] || '').indexOf('[illegible]') !== -1;
        st.className = 'alert ' + (unclear || r.confidence === 'low' ? 'alert-warn' : 'alert-good');
        st.textContent = unclear ? 'Read. Words marked [illegible] were hard to read. Fix them before sending.' : 'Read. Check every word and the lever, then send. AI drafted this; you decide.';
      }).catch(function (e) { st.className = 'alert alert-bad'; st.textContent = e.message; });
    }

          items.map(function (g) {
            var n = S.ballot[g.id] || 0;
            return '<li class="panel ballot-item"><span class="topic">' + esc(g.topic) + (g.contested ? ' <span class="contested" title="Tables tagged this differently">?</span>' : '') + '</span>' +
              '<span class="stepper"><button type="button" class="btn" data-less="' + esc(g.id) + '" aria-label="One vote fewer for ' + esc(g.topic) + '">−</button>' +
              '<span class="n" aria-live="polite">' + n + '</span><button type="button" class="btn" data-more="' + esc(g.id) + '" aria-label="One more vote for ' + esc(g.topic) + '">+</button></span></li>';
          }).join('') + '</ol>';
      });
      html += '<div id="voteErr" class="alert alert-bad" role="alert"></div>' +
        '<div class="remaining"><strong id="votesLeft"></strong><button type="button" class="btn btn-primary" id="voteSend">' + (S.sentBallot ? 'Update my votes' : 'Send my votes') + '</button></div>' +
        '<div class="next-person"><span class="muted small">Sharing this device? Send your votes, then</span><button type="button" class="btn btn-small" data-next-person="1">Next person</button></div>';
      panel(html);
      votesLeft();
      $('voteSend').onclick = function () {
        var choices = [];
        Object.keys(S.ballot).forEach(function (id) { for (var i = 0; i < S.ballot[id]; i++) choices.push(id); });
        if (!choices.length) return Capture.toast('Add at least one vote.');
        var label = $('voteSend').textContent, voter = S.voter, role = S.role, key = ballotKey();
        busy($('voteSend'), true, 'Sending…');
        Capture.run('captureSaveVote', SESSION_ID, CAPTURE_KEY, { voter: voter, role: role, choices: choices, table: S.table })
          .then(function () {
            if (voter === S.voter) { S.sentBallot = key; if (S.state) S.state.myVote = { role: role, choices: choices }; }
            label = 'Update my votes';
            if ($('voteErr')) $('voteErr').textContent = '';
            Capture.toast('Votes saved. You can change them until voting closes.');
          })
          .catch(function (e) { if ($('voteErr')) $('voteErr').textContent = 'Your votes are not saved yet. ' + e.message; else Capture.toast(e.message); })
          .then(function () { busy($('voteSend'), false, label); });
      };
    }
    function ballotSig() { return (S.state.ballot || []).map(function (g) { return g.id + ':' + g.topic + ':' + g.column; }).join('|'); }
    function ballotKey() { return Object.keys(S.ballot || {}).filter(function (id) { return S.ballot[id]; }).sort().map(function (id) { return id + 'x' + S.ballot[id]; }).join(','); }
    function used() { return Object.keys(S.ballot).reduce(function (n, k) { return n + S.ballot[k]; }, 0); }
    function votesLeft() { var el = $('votesLeft'); if (el) { var n = used(); el.textContent = n + (n === 1 ? ' vote placed' : ' votes placed'); } }

    // Results ------------------------------------------------------------------
    function viewResults() {
      var t = T(), r = S.state.results;
      $('view').innerHTML = '';
      if (!r) { panel('<h2>Results are coming</h2><p>The facilitators are counting.</p>'); return; }
      var a = S.state.table && S.state.table.assignment;
      if (a) panel('<h2>Your table’s priority</h2><div class="big-topic">' + esc(a.topic) + '</div><p class="muted small">You’ll test current guidance against it next.</p>');
      var html = '';
      r.columns.forEach(function (col) {
        if (!col.items.length) return;
        html += '<div class="col-head"><span class="level" data-route="' + col.route + '">' + esc(col.code) + '</span><strong>' + esc(col.label) + '</strong>' +
          (col.route === 'parking' ? '<span class="muted small">' + esc(t.routes.parking) + '</span>' : '') + '</div><ol class="list">' +
          col.items.slice(0, 10).map(function (i) {
            return '<li class="panel' + (a && a.id === i.id ? ' mine' : '') + '"><span class="rank">' + i.rank + '</span><span class="text">' + esc(i.topic) + '</span>' +
              '<span class="split">' + i.total + ' · ' + t.roles.map(function (x) { return esc(x.code) + ' ' + (i[x.code] || 0); }).join(' ') + '</span></li>';
          }).join('') + '</ol>';
      });
      panel('<h2>Ranked priorities</h2>' + html);
    }

    // Test drive ---------------------------------------------------------------
    function viewTestDrive() {
      var t = T(), a = S.state.table && S.state.table.assignment, td = (S.state.table && S.state.table.testDrive) || {}, notes = S.myNotes || td.mine || {};
      panel('<h2>Your table’s priority</h2>' + (a ? '<div class="big-topic">' + esc(a.topic) + '</div>' : '<p class="muted">A facilitator will tell you which need your table has.</p>') +
        '<p class="muted small">' + esc(t.testDrive.intro) + '</p>');
      panel('<h2>Your notes</h2>' + t.testDrive.prompts.map(function (p) { return textField('td_' + p.key, p.label, p.hint, t.testDrive.maxLength); }).join('') +
        '<div id="tdErr" class="alert alert-bad" role="alert"></div><button type="button" class="btn btn-primary btn-block" id="tdSend">Save notes</button>' +
        '<p class="muted small">Everyone at your table can save their own notes. Nobody’s notes replace anyone else’s.</p>');
      panel('<h2>Your table’s other notes</h2><div id="otherNotes"></div>');
      t.testDrive.prompts.forEach(function (p) { $('td_' + p.key).value = notes[p.key] || ''; $('td_' + p.key).dataset.saved = notes[p.key] || ''; });
      renderOtherNotes();
      $('tdSend').onclick = function () {
        var out = {}; t.testDrive.prompts.forEach(function (p) { out[p.key] = $('td_' + p.key).value; });
        busy($('tdSend'), true, 'Saving…');
        var voter = S.voter;
        Capture.run('captureSaveTestDrive', SESSION_ID, CAPTURE_KEY, S.table, out, voter).then(function () {
          if (voter === S.voter) S.myNotes = out;
          t.testDrive.prompts.forEach(function (p) { var a = $('td_' + p.key); if (a && a.value === out[p.key]) a.dataset.saved = out[p.key]; });
          if ($('tdErr')) $('tdErr').textContent = ''; Capture.toast('Notes saved.');
        }).catch(function (e) { if ($('tdErr')) $('tdErr').textContent = 'Not saved yet. ' + e.message; else Capture.toast(e.message); }).then(function () { busy($('tdSend'), false, 'Save notes'); });
      };
    }
    function renderOtherNotes() {
      var box = $('otherNotes'); if (!box) return;
      var t = T(), others = ((S.state.table && S.state.table.testDrive) || {}).others || [];
      box.innerHTML = others.length ? others.map(function (n) {
        return '<div class="others stack" style="margin-top:10px">' + t.testDrive.prompts.filter(function (p) { return n[p.key]; }).map(function (p) {
          return '<p><strong>' + esc(p.label) + ':</strong> ' + esc(n[p.key]) + '</p>'; }).join('') + '</div>';
      }).join('') : '<p class="muted small">None yet.</p>';
    }

    // Close --------------------------------------------------------------------
    function viewClose() {
      var url = S.state.surveyUrl;
      panel('<h2>Thank you</h2><p>Your input shapes the next version of the guidance.</p>' +
        (url ? '<a class="btn btn-primary btn-block" href="' + esc(url) + '" target="_blank" rel="noopener">Take the exit survey</a>' : ''));
    }

    // ── Shared actions ───────────────────────────────────────────────────────
    function busy(btn, on, label) { if (!btn) return; btn.disabled = on; btn.textContent = label; }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.mic) return toggleMic(b);
      if (b.dataset.view !== undefined) { stashDrafts(); S.view = b.dataset.view === S.stage ? '' : b.dataset.view; render(); window.scrollTo(0, 0); return; }
      if (b.dataset.nextPerson) return nextPerson();
      if (b.dataset.rmSignal) {
        var sid = b.dataset.rmSignal; b.disabled = true;
        return Capture.run('captureRemoveSignal', SESSION_ID, CAPTURE_KEY, Number(sid), S.tokens['s' + sid], S.table, S.voter).then(function () { delete S.tokens['s' + sid]; Capture.store(K + 'tokens', S.tokens); return load(false, true); }).catch(function (x) { b.disabled = false; Capture.toast(x.message); });
      }
      if (b.dataset.rmCard) {
        var cid = b.dataset.rmCard; b.disabled = true;
        return Capture.run('captureRemoveOwnCard', SESSION_ID, CAPTURE_KEY, Number(cid), S.tokens['c' + cid], S.table, S.voter).then(function () { delete S.tokens['c' + cid]; Capture.store(K + 'tokens', S.tokens); Capture.toast('Card removed.'); return load(false, true); }).catch(function (x) { b.disabled = false; Capture.toast(x.message); });
      }
      if (b.dataset.rmFlip) {
        b.disabled = true;
        return Capture.run('captureRemoveFlip', SESSION_ID, CAPTURE_KEY, S.table, Number(b.dataset.rmFlip), S.voter).then(function () { return load(false, true); }).catch(function (x) { b.disabled = false; Capture.toast(x.message); });
      }
      if (b.dataset.edit) {
        var li = b.closest('li'), f = ((S.state.table && S.state.table.flips) || []).find(function (x) { return String(x.id) === b.dataset.edit; });
        if (!f) return renderFlipList();
        li.innerHTML = '<label class="sr-only" for="ef' + f.id + '">Edit</label><textarea id="ef' + f.id + '" data-edit-flip="1" maxlength="' + T().parent.maxLength + '">' + esc(f.text) + '</textarea>' +
          '<div class="alert alert-bad" role="alert" id="efErr' + f.id + '"></div><div style="display:flex;gap:8px;margin-top:6px"><button type="button" class="btn btn-primary btn-small" data-save-flip="' + f.id + '">Save</button>' +
          '<button type="button" class="btn btn-small" data-cancel-edit="1">Cancel</button></div>';
        $('ef' + f.id).focus();
        return;
      }
      if (b.dataset.saveFlip) { var id = b.dataset.saveFlip; return saveFlip(Number(id), $('ef' + id).value, b, $('efErr' + id), function () { renderFlipList(true); }); }
      if (b.dataset.cancelEdit) return renderFlipList(true);
      if (b.dataset.top) {
        var top = b.getAttribute('aria-pressed') !== 'true'; b.disabled = true;
        return Capture.run('captureSetFlipTop', SESSION_ID, CAPTURE_KEY, S.table, Number(b.dataset.top), top, S.voter).then(function () { return load(false, true); }).catch(function (x) { b.disabled = false; Capture.toast(x.message); });
      }
      if (b.dataset.dot) {
        var k = b.dataset.dot, i = S.dots.indexOf(k);
        if (i === -1) S.dots.push(k);
        else S.dots.splice(i, 1);
        b.setAttribute('aria-pressed', String(i === -1)); countDots(); saveDots(); return;
      }
      if (b.dataset.more || b.dataset.less) {
        var gid = b.dataset.more || b.dataset.less;
        if (b.dataset.more) S.ballot[gid] = (S.ballot[gid] || 0) + 1;
        else if (S.ballot[gid]) S.ballot[gid]--;
        b.parentNode.querySelector('.n').textContent = S.ballot[gid] || 0; votesLeft(); return;
      }
    });

    // Dictation ------------------------------------------------------------------
    var activeRec = null;
    function toggleMic(button) {
      if (activeRec) { activeRec.stop(); return; }
      var box = $(button.dataset.mic), rec = new Speech();
      rec.lang = navigator.language || 'en-US'; rec.interimResults = false; rec.continuous = false;
      rec.onresult = function (e) {
        var said = '';
        for (var i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) said += e.results[i][0].transcript;
        if (said) { box.value = (box.value ? box.value.replace(/\s*$/, ' ') : '') + said.trim(); if (box.id === 'needText') S.sources.voice = true; if (box.id === 'sigText') S.sigVoice = true; }
      };
      rec.onerror = function (e) {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          document.querySelectorAll('[data-mic]').forEach(function (x) { x.hidden = true; });
          Capture.toast('The microphone isn’t allowed here. Your keyboard’s microphone still works.');
        }
      };
      rec.onend = function () { button.setAttribute('aria-pressed', 'false'); button.textContent = 'Speak'; activeRec = null; };
      try { rec.start(); activeRec = rec; button.setAttribute('aria-pressed', 'true'); button.textContent = 'Stop'; box.focus(); } catch (err) { activeRec = null; }
    }

    start();
  </script>
</body>
</html>

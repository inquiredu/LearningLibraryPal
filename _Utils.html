<script>
  /**
   * _Utils.html
   * Shared client-side utility functions for the MNGAIA Content Engine.
   * Injected into Index.html, Wizard.html, and LibraryPage.html.
   */

  /**
   * Prevents URLs from breaking when resolved against the GAS sandbox origin.
   * Ensures they start with https://.
   */
  function _safeUrl(url) {
    if (!url) return '#';
    url = String(url).trim();
    if (url.startsWith('//')) return 'https:' + url;
    return /^https?:\/\//i.test(url) ? url : 'https://' + url;
  }

  /**
   * Escapes HTML special characters to prevent XSS when rendering strings.
   */
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /**
   * Formats an ISO date string into a human-readable time in the app's timezone.
   * Requires _appTz and _appTzLabel to be defined globally in the parent page.
   */
  function _fmtTime(iso, tz, label) {
    if (!iso) return '';
    const timezone = tz || (typeof _appTz !== 'undefined' ? _appTz : 'America/Chicago');
    const tzLabel  = label || (typeof _appTzLabel !== 'undefined' ? _appTzLabel : 'CT');
    try {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: timezone,
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(new Date(iso)) + ' ' + tzLabel;
    } catch (e) {
      return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  }

</script>
